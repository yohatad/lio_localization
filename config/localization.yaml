# Runtime tuning for global_localization / transform_fusion.
#
# Edit and RELAUNCH -- no rebuild -- by pointing the launch at this file
# directly rather than at the installed copy:
#
#   ros2 launch lio_localization fastlio_localization_l2.launch.py \
#       params_file:=$HOME/ros2_ws/src/lio_localization/config/localization.yaml
#
# (The installed copy under install/ is only refreshed by colcon build, which is
# why the source path is the one to use while tuning.)
#
# THIS FILE IS THE ONLY SOURCE for the ICP tunables below. An earlier version
# of this note claimed `localization_th:=0.5` on the command line would win --
# it does NOT. fastlio_localization_l2.launch.py deliberately keeps its
# parameter dict minimal so the YAML is not shadowed (see the comment above the
# global_localization Node), which means anything absent from that dict cannot
# be set from the command line at all. localization_th and max_corr_dist were
# declared as launch arguments but never reached the node; those dead arguments
# have been removed. Edit them here.

/**:
  ros__parameters:

    # --- what ICP matches against ------------------------------------------
    # Radius the prior map is cropped to around the current estimate: the
    # SEARCH AREA. ICP never sees outside it, so a seed further off than this
    # cannot recover. 20 m suits a single room; raise it if the initial pose
    # may be badly wrong, lower it to reduce the chance of latching onto a
    # similar-looking region elsewhere in the building.
    fov_far: 10.0

    # Voxel leaf the prior .pcd is downsampled to on load.
    # MEASURED on bags/July_22: 0.4 gave 423 mm of correction jitter, 0.15 gave
    # ~400 mm, 0.05 gave 755 mm. Finer is NOT better here -- a denser map gives
    # point-to-point ICP more spurious correspondences on flat walls.
    map_voxel_size: 0.4

    # Voxel leaf for the live scan. 0.1 leaves only ~400 points, which is thin;
    # lowering it gives ICP more to constrain against, at CPU cost. Untested.
    #
    # 0.1, NOT the 0.05 that used to sit here: both localization launch files
    # hardcoded 'scan_voxel_size': 0.1 in the node parameter dict, which is
    # applied AFTER this file and therefore won every time. The 0.05 had never
    # once taken effect. The dict entry is gone, so this line is now the only
    # place the value is set -- it is written as the value that was actually
    # running, so removing the shadowing did not silently change behaviour.
    # Lower it here to try the finer leaf the comment above describes.
    scan_voxel_size: 0.1

    # --- ICP itself ---------------------------------------------------------
    # Correspondence radius at the fine scale, AND the radius the inlier-ratio
    # fitness is measured over -- deliberately the same number, so fitness
    # means "fraction that actually aligned".
    #
    # THIS COUPLES TO localization_th. MEASURED: at 0.25 a good lock scores
    # only 0.53, at 0.5 it scores 0.61, at 1.0 it scores 0.98 -- because that
    # is how well the scan and this prior map genuinely agree. Tightening it
    # also made the jitter WORSE (533 mm at 0.5, 1053 mm at 0.75, vs 423 mm at
    # 1.0), so the sliding-along-walls theory did not hold.
    #
    # 2026-08-12: 0.25 -> 1.0. At 0.25 a good lock scores 0.53 while
    # localization_th demanded 0.85, so EVERY match was rejected and the node
    # published no map frame at all -- the exact failure this block warns about.
    # The measurements above already favour 1.0 on both axes: best fitness for a
    # true lock (0.98) and lowest jitter (423 mm). The pair (max_corr_dist,
    # localization_th) must be chosen together; see the note below.
    max_corr_dist: 1.0
    icp_iterations: 40

    # Point-to-plane ICP instead of point-to-point.
    #
    # Point-to-point forces a one-to-one pairing, so on a large flat wall it
    # pulls the solution toward whichever arbitrary map point happened to be
    # nearest -- the same "spurious correspondences on flat walls" effect noted
    # against map_voxel_size above, and the mechanism behind the ~423 mm of
    # measured zero-mean jitter. Point-to-plane minimises distance to the PLANE
    # through the neighbour instead, so the scan may slide along a surface at no
    # cost and is penalised only for moving INTO or OUT OF it. That is the
    # correct constraint from a plane observation, and an indoor environment is
    # almost entirely planes.
    #
    # MEASURED 2026-08-23 on slam_august_8_bag, both arms at update_min_d 5.0,
    # 60 s windows. Point-to-plane came out WORSE and is NOT recommended:
    #     point-to-plane   n=16  median 2832 mm  p90 7935  fitness 0.97-1.00  50 ms
    #     point-to-point   n=23  median 1891 mm  p90 3487  fitness 0.89-0.95  25 ms
    #
    # Note the direction of the fitness column: point-to-plane scored HIGHER
    # while positioning WORSE. That is the signature of its known corridor
    # failure, and the flip side of the property that motivated trying it. By
    # removing the tangential penalty it lets the scan slide freely along a
    # surface -- excellent when the geometry constrains the along-track
    # direction, but in a feature-poor corridor nothing does, so the solution
    # slides while every point still lands on a plane and fitness reads near
    # perfect. High fitness stops being evidence of a good lock.
    #
    # INDICATIVE, NOT CONCLUSIVE: n is small, FAST-LIO replay is
    # nondeterministic (see the loop-noise note in fastlio_lc_pgo), and both
    # arms are inflated by the 5 m gate spacing plus the initial convergence,
    # which is why both medians sit far above the 153 mm historical figure
    # measured ungated at 2 Hz. The RANKING between arms is the usable result.
    #
    # OFF by default. localization_th is calibrated against point-to-point
    # fitness; re-check it if this is ever switched on.
    #
    # Falls back to point-to-point automatically when the cropped map is too
    # sparse to fit planes through, or when normal estimation fails on nearly
    # every point.
    point_to_plane: false
    # Neighbours used per map-point normal. Larger is smoother and slower;
    # normals are re-estimated on the cropped map every correction, which is the
    # dominant added cost of point-to-plane.
    normal_k: 10

    # NOTE: an out-of-plane (z/roll/pitch) ICP constraint lived here until
    # 2026-09-02. It was removed because it fought planar_lock: that holds
    # map -> base_footprint on the floor by letting map -> odom absorb
    # FAST-LIO's vertical drift, while this clamped map -> odom to a frozen
    # anchor, so past out_of_plane_z_margin of drift every ICP seed was
    # dragged off and correspondences collapsed. planar_lock (declared in
    # global_localization.cpp, default true) is now the single owner of the
    # floor constraint.

    # --- plausibility (innovation gate) --------------------------------------
    # Fitness alone cannot separate a true lock from a confident WRONG one. In a
    # corridor the ICP cost surface is nearly flat along the corridor axis, so
    # the solution slides while every point still lands on a wall and the inlier
    # ratio reads near-perfect -- MEASURED: the point-to-plane arm scored
    # 0.97-1.00 while positioning WORSE than point-to-point.
    #
    # This gates on something fitness does not know: how far the robot actually
    # travelled. Odometry drifts at a measured 0.1% of path length, so over a
    # known distance there is a bound on how far map -> odom can legitimately
    # need to move. Beyond it the match is not correcting drift, it is relocating.
    #
    # WHY IT WAS ADDED: measured corrections were 1891 mm median after a 5 m
    # gate, where 0.1% drift predicts ~5 mm -- roughly 400x more than drift can
    # explain, i.e. bad matches being accepted, not scatter.
    #
    # This is the standard innovation / Mahalanobis gate of any Kalman-style
    # estimator, sized from a measured drift rate instead of a covariance.
    innovation_gate: true
    odom_drift_rate: 0.001          # MEASURED: 0.1% closure over a ~165 m run
    innovation_safety_factor: 10.0  # generous: 0.1% is END-POINT closure, which
                                    # lets systematic bias cancel, so true
                                    # mid-run drift exceeds what it implies
    innovation_min: 0.30            # metres. Floor, so a correction taken at a
                                    # standstill does not get a zero budget and
                                    # reject everything. Above a good lock's
                                    # scatter, below a real relocalization.
    #
    # MEASURED 2026-08-23 on slam_august_8_bag, 60 s windows, same config
    # otherwise. map -> odom step magnitude:
    #     no gate            n=23  median 1891 mm  p90 3487  max 7110
    #     innovation gate    n=22  median  309 mm  p90  751  max 1085
    # A ~6x reduction in both median and worst case.
    #
    # What it rejected proves the diagnosis -- every one of these passed the
    # fitness gate:
    #     1.41 m jump after 0.09 m travelled, fitness 0.964
    #     0.69 m jump after 0.08 m travelled, fitness 0.992
    #     0.66 m jump after 0.90 m travelled, fitness 1.000
    # A metre of correction after nine centimetres of travel is not drift, and
    # fitness 0.99 did not notice. That is what this gate is for.
    #
    # NOTE the residual median (309 mm) now sits essentially AT innovation_min
    # (300 mm), so the floor -- not the drift budget -- is what bounds the
    # remaining jumping. Lower innovation_min to push further, at the risk of
    # rejecting good corrections; that is the next knob, not the safety factor.
    innovation_max_rejects: 3       # consecutive violations before the gate
                                    # yields. A genuine relocalization (bumped,
                                    # pushed, carried) also violates the gate and
                                    # must not be locked out forever: one outlier
                                    # is noise, several in a row are the world.
                                    # Too low waves a corridor slide through; too
                                    # high makes real recovery slow.

    # YAW counterpart of the gate above. Fitness cannot separate a correct yaw
    # from a plausible-looking WRONG one either -- a symmetric hallway matched
    # backwards still lands every point on a wall. Same shape, mirrored onto
    # rotation: budget scales with how much the robot has actually YAWED since
    # the last accepted correction, not with distance travelled, because a
    # robot spinning in place (plausible on Pepper's omni base) accumulates
    # yaw-only drift that a distance-based budget would gate to zero.
    #
    # Shares consec_rejects_/innovation_max_rejects above with the translation
    # gate: a violation of EITHER axis counts toward the same escape hatch, so
    # there is only one "how many violations before this is a real
    # relocalization" knob to tune, not two.
    #
    # UNTESTED as of 2026-08-31 -- both values below are physically-reasoned
    # placeholders (yaw drift rate set higher than translation's 0.001 because
    # yaw is documented elsewhere as FAST-LIO's weakest axis), not measured
    # against this workspace's bags. Re-run the same 60 s-window measurement
    # process used for the translation gate above before trusting these; watch
    # the reject-log lines for which axis (m vs deg) is actually triggering.
    yaw_drift_rate: 0.02        # unitless fraction of yaw rotated since the
                                # last accepted correction (translation's
                                # odom_drift_rate is 0.001 of distance)
    innovation_yaw_min: 0.05    # radians (~2.9 deg). Floor, so a correction
                                # taken at a standstill (or pure translation,
                                # zero net yaw) does not get a zero yaw budget.

    # --- acceptance ---------------------------------------------------------
    # Minimum inlier-ratio fitness to accept a match and publish a correction.
    # 0.95 is only reachable with max_corr_dist 1.0 (measured 0.98 there); at
    # any tighter radius a GOOD lock scores 0.53-0.61 and everything is
    # rejected, leaving no map frame at all.
    #
    # VALID ONLY WITH max_corr_dist: 1.0, where a true lock measures 0.98 and
    # 0.85 leaves clear margin. If you tighten max_corr_dist you MUST lower this
    # in step (roughly 0.45 at 0.25, 0.50 at 0.5) or nothing is ever accepted.
    # Do not raise it above 0.95: the gap between a true lock and a confident
    # WRONG lock is what this gate is for, and a false lock is worse than none.
    localization_th: 0.85

    # --- rate ---------------------------------------------------------------
    # ICP corrections per second. MEASURED: 2 Hz gives 153 mm median correction
    # steps vs 352 mm at upstream's 0.5 Hz, because less drift accumulates
    # between corrections. Each match costs 25-75 ms, so 2 Hz is ~10% duty.
    #
    # 2026-08-12: 1.0 -> 2.0. The value contradicted the measurement directly
    # above it. fastlio_localization_l2.launch.py also declared a
    # freq_localization argument defaulting to 2.0 with the same justification,
    # but that argument never reached the node, so the effective rate was 1.0
    # and both the comment and the launch default were describing a setting that
    # was not in use. That dead argument has been removed.
    freq_localization: 2.0

    # MOTION GATE (AMCL's update_min_d / update_min_a).
    #
    # freq_localization above is now the MAXIMUM correction rate, not the rate.
    # A correction only runs once the robot has moved this far in the ODOM
    # frame since the last one. Measured in odom, not map, deliberately: odom
    # is continuous by REP-105, whereas measuring in map would fold our own
    # corrections back into the gate and let ICP noise masquerade as motion,
    # re-triggering itself.
    #
    # WHY: a stationary robot generates no new information, so a match computed
    # at rest is measurement noise injected straight into map -> odom -- the
    # pose visibly wanders while the robot stands still. Holding the last
    # correction instead is correct, not lazy: map -> odom only goes stale as
    # fast as odometry drifts, and a robot that has not moved has not drifted.
    #
    # These are OR'd: a correction runs as soon as EITHER threshold is passed.
    # That matters for the values below -- update_min_d only gates STRAIGHT-LINE
    # travel, because any turn beyond update_min_a corrects regardless.
    #
    # 2026-08-22: update_min_d 0.25 -> 5.0. AMCL's 0.25 is sized for WHEEL
    # odometry, which drifts an order of magnitude worse than lidar-inertial.
    #
    # MEASURED: FAST-LIO closed the full run to 0.1% of path length (returned to
    # its start point over ~165 m). At that drift rate the gate costs:
    #     5 m   ->    5 mm accumulated drift
    #    25 m   ->   25 mm  (half a 0.05 m costmap cell)
    #   153 m   ->  153 mm
    # against a MEASURED median ICP correction of 153 mm. So over this 5 m gate
    # each correction injects ~30x more scatter than the drift it removes, and
    # you would have to drive ~153 m before drift even equalled the noise in a
    # single correction. Corrections here are noise injection, not drift
    # removal, and 5 m is conservative rather than aggressive.
    #
    # CAVEAT on that 0.1%: loop closure measures END-POINT error, and an
    # out-and-back path lets systematic bias cancel. Worst-case mid-run
    # excursion is larger than the closure figure implies, which is part of why
    # this is not set to 25 m. The other part is below.
    #
    # update_min_a stays TIGHT on purpose. Yaw is FAST-LIO's weakest axis (see
    # utils/L2_IMU/REPORT.md and the l2_rsimu.yaml rationale), so rotation is
    # where the correction is actually earning its keep. Do not raise it to
    # match update_min_d.
    #
    # WHY NOT LARGER, given drift is negligible: with drift this small the
    # correction is no longer doing drift removal at all -- its remaining job is
    # DETECTION. It is what notices the robot has been bumped, pushed, or has
    # locked onto the wrong place, and none of that scales with distance
    # travelled. Stretching the gate stretches the blind window for those.
    #
    # KNOWN COST: at max_vel_x 0.5 m/s, 5 m is ~10 s of driving on a stale
    # correction. Nothing here detects a bad lock and corrects early -- if a
    # match goes wrong, or the robot is disturbed, that is how long the global
    # costmap plans against a stale pose. Lower this (1-2 m) if navigation ever
    # looks confidently misplaced in a crowd.
    #
    # NEXT LEVER, now that odometry is not the limit: the 153 mm ICP scatter is
    # the dominant pose error. Improving it means attacking the registration
    # (map_voxel_size, scan_voxel_size, a point-to-plane ICP instead of
    # point-to-point), NOT the correction rate.
    #
    # Set BOTH to 0.0 to restore purely time-based correction.
    update_min_d: 5.0      # metres travelled before the next correction
    update_min_a: 0.2      # radians rotated before the next correction

    # Rate transform_fusion rebroadcasts the latest correction as TF.
    fusion_rate: 50.0

    # How far ahead the broadcast map -> odom is stamped, so a consumer looking
    # up a stamp slightly in the future (its own sensor stamp, a control cycle
    # scheduled a few ms out) reuses a still-valid transform instead of failing
    # to extrapolate. map -> odom is piecewise-constant between corrections, so
    # declaring it good a little ahead costs no accuracy. AMCL's Nav2 default
    # is 1.0 s; 0.1 is ample here because this rebroadcasts at fusion_rate.
    transform_tolerance: 0.1

    # --- reported uncertainty -----------------------------------------------
    # The pose covariance stamped on /map_to_odom, and forwarded by
    # transform_fusion onto /localization/pose. Interpolated between these
    # bounds by ICP fitness, rescaled over [localization_th, 1.0]: a
    # barely-accepted match reports the _max, a near-perfect one the _min. The
    # /initialpose seed reports the _max outright, having no ICP behind it.
    #
    # These are a monotone confidence proxy, NOT a propagated covariance --
    # inlier ratio says how much of the scan agrees with the map, not how the
    # disagreement distributes over x/y/yaw. Nor does either bound model the
    # LIO drift accumulated between corrections (freq_localization, 2 Hz), so
    # the true uncertainty mid-interval is somewhat larger than reported.
    # Size them against the measured correction jitter above (~423 mm at the
    # current map_voxel_size) rather than trusting the defaults.
    #
    # Zero is NOT a safe default here, which is why these exist: an all-zero
    # covariance asserts a perfect pose, and a downstream EKF reading that will
    # either discard every other sensor or fail on a singular matrix.
    pose_sigma_xy_min: 0.03      # metres, 1-sigma, at fitness 1.0
    pose_sigma_xy_max: 0.30      # metres, 1-sigma, at fitness == localization_th
    pose_sigma_yaw_min: 0.01     # radians, 1-sigma, at fitness 1.0
    pose_sigma_yaw_max: 0.10     # radians, 1-sigma, at fitness == localization_th

    # --- seeding ------------------------------------------------------------
    # Treat /initialpose as the ROBOT's pose in map (what RViz publishes) and
    # compose out odom->base internally, rather than assuming it is already a
    # map->odom seed. Leave true.
    initial_pose_is_base: true
